name: Site maintenance checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: scripts/archive-fetcher
      - run: bun --no-install run check
      - run: bun --no-install test scripts
      - run: bun --no-install run build
      - run: bun --no-install run verify:build
      - name: Build production container and verify content negotiation
        run: |
          docker build -t alenev-maintenance .
          docker run -d --name alenev-maintenance -p 127.0.0.1:8080:80 alenev-maintenance
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/ -o /dev/null
          curl --fail -H 'Accept: text/markdown' http://127.0.0.1:8080/ -o page.md
          grep 'Source: https://alenev.ru' page.md
          curl --fail --head -H 'Accept: text/markdown' http://127.0.0.1:8080/en/ | grep -i 'content-type: text/markdown'
      - name: Sandboxed browser journeys with local assets only
        run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: site-maintenance-browser
          path: output/maintenance-browser/
          if-no-files-found: ignore
